<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kritik dan Saran - Kuliner Nusantara</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script>
        // Apply dark mode immediately to prevent flash
        if (localStorage.getItem('darkMode') === 'enabled') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
</head>
<body>

    <header>
        <h1>🍲 Resep Makanan Khas Nusantara 🍲</h1>
        <p>Jelajahi Kekayaan Rasa Kuliner Tradisional Indonesia</p>
        <nav>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul>
                <li><a href="Index.Html">Beranda</a></li>
                <li><a href="kritik-saran.html">Kritik dan Saran</a></li>
                <li><a href="tentang-kami.html">Tentang Kami</a></li>
            </ul>
        </nav>
        <button id="dark-mode-toggle">🌙 Dark Mode</button>
    </header>

    <main>
        <button id="back-to-home" class="back-button">← Kembali ke Beranda</button>

        <section id="feedback">
            <h2>Kritik dan Saran</h2>
            <form id="feedback-form">
                <div class="form-group">
                    <label for="name">Nama:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Pesan:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit">Kirim</button>
            </form>
            <div id="feedback-list">
                <h3>Umpan Balik Terbaru:</h3>
                <ul id="feedback-items"></ul>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Resep Nusantara.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
